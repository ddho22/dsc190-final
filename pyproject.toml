[project]
name = "reqgen"
version = "0.1.0"
description = "Generate requirements.txt from Python source files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
reqgen = "reqgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reqgen"]
